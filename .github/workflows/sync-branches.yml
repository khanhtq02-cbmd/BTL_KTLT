name: Sync branches with main
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Merge main into member branches
        run: |
          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          for b in $(git branch -r --format='%(refname:short)' | grep -v -e 'origin/main' -e 'origin/HEAD' | sed 's|origin/||'); do
            git checkout -q -B "$b" "origin/$b"
            if git merge origin/main -m "Auto-merge main into $b"; then
              git push origin "$b"
            else
              git merge --abort
              echo "::warning::Conflict in $b, needs manual merge"
            fi
          done
